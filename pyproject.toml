[tool.poetry]
name = "rag-service"
version = "0.1.0"
description = "Production-grade RAG service with hybrid retrieval and RAGAS evaluation"
authors = ["Piyush"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.0"
pgvector = "^0.3.0"

# Embeddings & retrieval
pypdf = "^4.0.0"
openai = "^1.35.0"
sentence-transformers = "^3.0.0"
rank-bm25 = "^0.2.2"

# LangChain (Phase 5 — installed now so it's ready)
langchain = "^0.2.0"
langchain-openai = "^0.1.0"
langgraph = "^0.1.0"

# Evaluation
ragas = "^0.1.0"

# Observability
langfuse = "^2.0.0"

# Config & utilities
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
tenacity = "^8.3.0"    # retries for API calls

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
ruff = "^0.4.0"
ipykernel = "^6.29.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
